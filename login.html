<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Login - TopUpZone</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- ================= ANIMATED BACKGROUND ================= -->
    <div class="login-bg">
        <div class="gradient-blob blob-1"></div>
        <div class="gradient-blob blob-2"></div>
        <div class="gradient-blob blob-3"></div>
    </div>

    <!-- ================= LOGIN CONTAINER ================= -->
    <div class="login-wrapper">

        <!-- ================= LEFT SIDE (DESKTOP ONLY) ================= -->
        <div class="login-left">
            <div class="login-left-content">
                <h1 class="login-brand">🎮 TopUpZone</h1>
                <p class="login-subtitle">Top Up Game Murah & Cepat</p>
                
                <div class="login-features">
                    <div class="feature-item">
                        <i class="fas fa-bolt"></i>
                        <span>Proses Cepat</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-shield-alt"></i>
                        <span>Aman & Terpercaya</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-dollar-sign"></i>
                        <span>Harga Terbaik</span>
                    </div>
                </div>

                <div class="login-illustration">
                    <i class="fas fa-gamepad"></i>
                </div>
            </div>
        </div>

        <!-- ================= RIGHT SIDE (LOGIN FORM) ================= -->
        <div class="login-right">
            <div class="login-form-container">

                <div class="login-header">
                    <h2>Selamat Datang!</h2>
                    <p>Masuk ke akun TopUpZone Anda</p>
                </div>

                <form id="loginForm" class="login-form">

                    <!-- EMAIL INPUT -->
                    <div class="form-group-login">
                        <label for="email">Email atau Username</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input 
                                type="text" 
                                id="email" 
                                name="email" 
                                placeholder="Masukkan email atau username"
                                required>
                        </div>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <!-- PASSWORD INPUT -->
                    <div class="form-group-login">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Masukkan password"
                                required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <!-- REMEMBER ME & FORGOT PASSWORD -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember" id="remember">
                            <span>Ingat saya</span>
                        </label>
                        <a href="#" class="forgot-password">Lupa Password?</a>
                    </div>

                    <!-- LOGIN BUTTON -->
                    <button type="submit" class="login-btn">
                        <span>Masuk</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                </form>

                <!-- DIVIDER -->
                <div class="divider">
                    <span>atau</span>
                </div>

                <!-- SOCIAL LOGIN -->
                <div class="social-login">
                    <button class="social-btn google-btn" type="button">
                        <i class="fab fa-google"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn facebook-btn" type="button">
                        <i class="fab fa-facebook"></i>
                        <span>Facebook</span>
                    </button>
                </div>

                <!-- SIGNUP LINK -->
                <div class="signup-link">
                    <p>Belum punya akun? <a href="#">Daftar di sini</a></p>
                </div>

            </div>
        </div>

    </div>

    <!-- ================= DARK MODE TOGGLE ================= -->
    <button id="darkModeBtn" class="dark-btn-login">
        🌙
    </button>

    <!-- ================= BACK TO HOME ================= -->
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
    </a>

    <script src="login.js"></script>

</body>

</html>
